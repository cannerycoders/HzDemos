<head>
  <style> 
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #000;
    font-size: clamp(15px, 1.5vw, 18px);
    color: #aaa;
  }

  body.loading .TouchOnly {
    display: flex;
  }

  body.loading .DesktopOnly {
    display: none;
  }

  /* After initialization */
  body:not(.loading):not(.touch) .TouchOnly {
    display: none;
  }

  body.touch .DesktopOnly {
    display: none;
  }

  h1 {
    font-size: clamp(1.75rem, 5vw, 3rem);
  }
  h2 {
    font-size: clamp(1.4rem, 3.5vw, 2rem);
  }

  a {
    text-decoration: none;
  }
  a:hover {
    color: #aac;
  }
  #globeViz {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  #quakeInfo {
    position: absolute;
    top: 5px;
    right: 5px;
    border-radius: 10px;
    max-width: 220px;
    max-height: 100%;
    overflow-y: auto;
    background-color: rgb(57, 57, 146, 27%);
  }
  #hzbridge {
    position: absolute;
    bottom: 0px;
    width: 100%;
  }
  #hzbridge iframe {
    width: 100%;
  }
  #logo {
    max-width: 300px;
    widtH: 25%;
    position: absolute;
    top: 5px;
    left: 5px;
    opacity: .75;
    border-radius: 4%;
  }
  #logo img {
    width: 100%;
  }
  #logo svg {
    position: absolute;
    top: 15px;
    left: 15px;
    fill: white;
    opacity: .6;
  }
  table {
    color: #aaa;
    border-width: thin;
    border-color: #125;
    border-style: solid;
    padding: 5px;
    font-size: .6em;
    font-family:sans-serif;
    border-spacing: 2px 10px; 
  }
  th {
    text-align: left;
  }
  a {
    color: rgb(245, 232, 209);
  }
  </style>
  <link rel="icon" href="favicon.png">

</head>

<body class="loading">
  <div class="DesktopOnly" id="globeViz"></div>
  <div class="DesktopOnly" id="quakeInfo"></div>
  <div class="DesktopOnly" id="hzbridge"></div>
  <div class="DesktopOnly" id="logo">
    <img class="DesktopOnly" id="logo" src="img/quakesounds.jpg">
